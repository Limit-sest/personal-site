name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Warn-only here: CI's job is to prove the build compiles, and it should
      # not go red for a build that merely lacks a licensed font. The deploy
      # workflow requires it.
      - name: Restore licensed fonts
        env:
          AGRANDIR_WOFF2_B64: ${{ secrets.AGRANDIR_WOFF2_B64 }}
        run: ./scripts/restore-licensed-fonts.sh

      - name: Build
        run: npm run build
